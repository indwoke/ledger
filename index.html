/* ---------- money + dates ---------- */
const F0=new Intl.NumberFormat("en-IN",{maximumFractionDigits:0}), F2=new Intl.NumberFormat("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const inr=n=>(n<0?"−":"")+"₹"+(Math.abs(n%1)>.004?F2:F0).format(Math.abs(n));
const inr0=n=>"₹"+F0.format(Math.round(n));
const short=n=>n>=1e7?"₹"+(n/1e7).toFixed(n>=1e8?0:1).replace(/\.0$/,"")+"Cr":n>=1e5?"₹"+(n/1e5).toFixed(1).replace(/\.0$/,"")+"L":n>=1e3?"₹"+(n/1e3).toFixed(1).replace(/\.0$/,"")+"k":"₹"+Math.round(n);
const pad=n=>String(n).padStart(2,"0");
const isoD=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayIso=()=>isoD(new Date());
const pd=s=>{const m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],m[2]-1,+m[3]):null};
const dShort=s=>{const d=pd(s);return d?d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}):""};
const dLong=s=>{const d=pd(s);return d?d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):""};
const monthKey=s=>String(s).slice(0,7);
const monthName=k=>{const [y,m]=k.split("-");return new Date(+y,+m-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"})};
const monthAb=k=>{const [y,m]=k.split("-");return new Date(+y,+m-1,1).toLocaleDateString("en-GB",{month:"short"})};
function fyRange(){const d=new Date(),y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return [y+"-04-01",(y+1)+"-03-31","FY "+y+"–"+String(y+1).slice(2)]}
function periodOk(e){
  if(period==="all") return true;
  const t=new Date(), cur=t.getFullYear()+"-"+pad(t.getMonth()+1);
  if(period==="month") return monthKey(e.date)===cur;
  if(period==="last"){const l=new Date(t.getFullYear(),t.getMonth()-1,1);return monthKey(e.date)===l.getFullYear()+"-"+pad(l.getMonth()+1)}
  if(period==="fy"){const [a,b]=fyRange();return e.date>=a&&e.date<=b}
  return true;
}
const PERIODS=()=>[["all","All time"],["month","This month"],["last","Last month"],["fy",fyRange()[2]]];
const periodLabel=()=>PERIODS().find(p=>p[0]===period)[1];

/* ---------- derived ---------- */
const active=e=>e.status!=="void";
const typeOf=p=>((data.projects||[]).find(x=>x.project===p)||{}).type||(p===COMPANY?"company":"pilot");

const projects=()=>{const s=new Set([DEFAULT_PROJECT]);(data.projects||[]).forEach(p=>p.project&&s.add(p.project));data.expenses.forEach(e=>e.project&&s.add(e.project));data.budget.forEach(b=>b.project&&s.add(b.project));return [...s]};
const net=e=>(+e.amount||0)-(+e.gst||0);
const sum=a=>Math.round(a.reduce((t,e)=>t+net(e),0)*100)/100;           // cost, excluding GST
const paid=a=>Math.round(a.reduce((t,e)=>t+(+e.amount||0),0)*100)/100;  // what actually left the account
const gstOf=a=>Math.round(a.reduce((t,e)=>t+(+e.gst||0),0)*100)/100;
const isPerson=p=>!!p&&p!=="company";

const owed=e=>isPerson(e.paidBy)&&e.reimb==="pending";

const flags=e=>({noreceipt:!e.receipt,nomode:!e.mode,unset:!e.paidBy||(isPerson(e.paidBy)&&!e.reimb)});
const needsReview=e=>{const f=flags(e);return f.noreceipt||f.nomode||f.unset};
const title=e=>e.where||e.paidTo||e.category;

function groupBy(list,key){const m={};list.forEach(e=>{const k=typeof key==="function"?key(e):e[key];(m[k]=m[k]||[]).push(e)});return m}
function budgetRows(){return data.budget.filter(b=>inScope(b.project))}
// months as integers, for spreading a budget line evenly across its months
const mi=ym=>{const m=String(ym||"").match(/^(\d{4})-(\d{2})/);return m?+m[1]*12+(+m[2]-1):null};
const ymOf=i=>Math.floor(i/12)+"-"+pad(i%12+1);
function periodMonths(){const t=new Date(),c=t.getFullYear()*12+t.getMonth();
  if(period==="month")return [c,c]; if(period==="last")return [c-1,c-1];
  if(period==="fy"){const [a,b]=fyRange();return [mi(a),mi(b)]} return [-1e9,1e9]}
function planIn(r,a,b){const f=mi(r.from),t=mi(r.to||r.from);if(f==null||t==null)return (a<-1e8?r.amount:0);const lo=Math.max(f,a),hi=Math.min(t,b);return hi<lo?0:r.amount*(hi-lo+1)/(t-f+1)}
const nowM=()=>{const t=new Date();return t.getFullYear()*12+t.getMonth()};
function missingLastMonth(){ // regular lines with a plan for last month but under half of it entered
  const m=nowM()-1, ym=ymOf(m), out=[];
  NUDGE_HEADS.forEach(h=>{const plan=data.budget.filter(r=>r.head===h).reduce((t,r)=>t+planIn(r,m,m),0);
    const got=sum(data.expenses.filter(e=>active(e)&&e.head===h&&monthKey(e.date)===ym));
    if(plan>0&&got<plan*.5) out.push({head:h,plan,got})});
  return {ym,out};
}
const PDEF={type:"pilot",envelope:0,from:"",to:"",units:"",unitLabel:"unit",note:""};
function book(p){p=p||project;
  if(p==="all"||p==="pilots"){const bs=(data.projects||[]).filter(x=>inScope(x.project,p));const f=bs.map(x=>x.from).filter(Boolean).sort(),t=bs.map(x=>x.to).filter(Boolean).sort();
    return Object.assign({},PDEF,{project:p,type:p==="pilots"?"pilot":"all",envelope:bs.reduce((s,x)=>s+(+x.envelope||0),0),from:f[0]||"",to:t[t.length-1]||"",units:bs.length===1?bs[0].units:"",unitLabel:bs.length===1?bs[0].unitLabel:"unit"})}
  return Object.assign({},PDEF,{project:p},(data.projects||[]).find(x=>x.project===p)||{})}
const monRange=b=>b.from?(monthAb(b.from)+" "+b.from.slice(0,4)+(b.to&&b.to!==b.from?" – "+monthAb(b.to)+" "+b.to.slice(0,4):"")):"";
const DOSSIER=/openai|chatgpt|genspark/i;
const streamFor=(c,t)=>DOSSIER.test(t||"")?"field":(STREAM_FOR[c]||"field"), headFor=(c,t)=>DOSSIER.test(t||"")?"Field operations":(HEAD_FOR[c]||"Field operations");
const streamOf=e=>e.stream||streamFor(e.category,e.where+" "+e.paidTo);

/* ---------- network ---------- */
async function api(op,extra){
  if(!cfg.url) throw new Error("No Ledger link set");
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),45000);
  try{
    const r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({op,who:cfg.who,pass:cfg.pass},extra||{})),signal:ctl.signal,redirect:"follow"});
    const j=await r.json();
    if(!j.ok&&/passcode|No passcode/i.test(j.error||"")&&op!=="status"&&op!=="claim"){signOut(true);}
    return j;
  } finally{clearTimeout(t)}
}
function persist(){ls("ld.data",data);ls("ld.queue",queue)}
function applyLocal(op){
  if(op.op==="save"){const i=data.expenses.findIndex(e=>e.id===op.item.id);if(i>=0)data.expenses[i]=Object.assign({},data.expenses[i],op.item);else data.expenses.push(op.item)}
  if(op.op==="void"||op.op==="restore"){const e=data.expenses.find(x=>x.id===op.id);if(e)e.status=op.op==="void"?"void":""}
}
function enqueue(op){applyLocal(op);queue.push(op);persist();render();flush()}
async function flush(){
  if(busy||!queue.length||!cfg.pass) return;
  busy=true; setSync();
  try{
    while(queue.length){
      const op=queue[0];
      const r=await api(op.op,op.op==="save"?{item:op.item}:{id:op.id});
      if(!r.ok&&!/Not found/.test(r.error||"")){toast(r.error||"Could not save");if(/Amount|date/i.test(r.error||""))queue.shift();break}
      if(r.item) applyLocal({op:"save",item:r.item});
      queue.shift(); persist(); online=true;
    }
  }catch(e){online=false}
  busy=false; setSync(); render();
}
async function load(quiet){
  if(!cfg.pass) return;
  const b=$("#refresh"); b.classList.add("spin");
  try{
    await flush();
    const r=await api("list");
    if(r.ok){
      data={expenses:r.expenses||[],budget:r.budget||[],projects:r.projects||[],imports:r.imports||[],sheetUrl:r.sheetUrl,folderUrl:r.folderUrl,sources:r.sources||[],phases:r.phases||[],field:r.field||null,approvals:r.approvals||[],people:r.people||{},activities:r.activities||[],schoolsList:r.schoolsList||[]};
      queue.forEach(applyLocal); online=true; lastSync=Date.now(); ls("ld.last",lastSync); persist();
    } else if(!quiet) toast(r.error||"Could not load");
  }catch(e){online=false; if(!quiet) toast("Offline — showing saved copy")}
  b.classList.remove("spin"); setSync(); render();
}
function setSync(){
  const d=$("#dot"), t=$("#syncText");
  if(busy){d.className="warn";t.textContent="Saving…";return}
  if(queue.length){d.className="warn";t.textContent=queue.length+" to sync";return}
  if(!online){d.className="warn";t.textContent="Offline";return}
  d.className="ok";
  const m=lastSync?Math.round((Date.now()-lastSync)/6e4):0;
  t.textContent=m<1?"Up to date":m<60?m+" min ago":"Synced";
}

/* ---------- overview ---------- */
function donut(parts,total){
  const r=52,C=2*Math.PI*r;let off=0;
  const segs=parts.map(p=>{const len=total?p.v/total*C:0;const s=`<circle r="${r}" cx="66" cy="66" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${Math.max(len-1.5,0)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"/>`;off+=len;return s}).join("");
  return `<svg class="donut" viewBox="0 0 132 132"><circle r="${r}" cx="66" cy="66" fill="none" stroke="var(--fill)" stroke-width="18"/>${segs}<text x="66" y="66" text-anchor="middle" font-size="19" dy="2">${short(total)}</text><text x="66" y="84" text-anchor="middle" font-size="11" style="fill:var(--ink3);font-family:var(--sans);font-weight:700">total</text></svg>`;
}

  const s=scoped(), tot=sum(s), V=$("#view");

function rowHtml(e){
  const t=title(e), meta=[dShort(e.date)];
  if(t!==e.category) meta.push(esc(CAT_SHORT[e.category]||e.category));
  const tags=[];
  if(srcTag(e)) tags.push(`<span class="tag src">${srcTag(e)}</span>`);
  if(owed(e)) tags.push('<span class="tag warn">To reimburse</span>');
  if(e.reimb==="settled") tags.push('<span class="tag ok">Settled</span>');
  if(e.status==="void") tags.push('<span class="tag red">Voided</span>');
  if(e.school) tags.push(`<span class="tag">${esc(e.school.replace("School ","S"))}</span>`);
  if(e.tagReview) tags.push('<span class="tag warn">Confirm tag</span>');
  return `<button class="ex${e.status==="void"?" void":""}" data-id="${esc(e.id)}">${catIc(e.category)}<div style="min-width:0"><div class="t">${esc(t)}</div><div class="m">${meta.join(" · ")} ${whoDot(e.paidBy)} ${e.receipt?IC.clip:""} ${tags.join(" ")}</div></div><div class="a">${inr(e.amount)}${e.mode||e.gst?`<small>${[e.mode?esc(e.mode):"",+e.gst?"GST "+inr(+e.gst):""].filter(Boolean).join(" · ")}</small>`:""}</div></button>`;
}
function bindRows(el){el.querySelectorAll(".ex[data-id]").forEach(b=>b.onclick=()=>openExpense(data.expenses.find(e=>e.id===b.dataset.id)))}
const FLAGS={tag:"Confirm tag",gst:"With GST",owed:"To reimburse",review:"Need details",noreceipt:"No receipt",nomode:"No payment mode",unset:"Who paid not set",void:"Voided"};
function renderExpenses(){
  const V=$("#view");
  let list=data.expenses.filter(e=>inProject(e)&&periodOk(e)&&(fFlag==="void"?!active(e):active(e)));
  if(fCat) list=list.filter(e=>e.category===fCat);
  if(fHead) list=list.filter(e=>e.head===fHead);
  if(fFlag==="owed") list=list.filter(owed);
  if(fFlag==="gst") list=list.filter(e=>+e.gst>0);
  if(fFlag==="tag") list=list.filter(e=>e.tagReview);
  if(fSchool) list=list.filter(e=>(e.school||"")===fSchool);
  if(fAct) list=list.filter(e=>e.activity===fAct||phaseOf(e.activity)===fAct);
  if(fFlag==="review") list=list.filter(needsReview);
  if(["noreceipt","nomode","unset"].includes(fFlag)) list=list.filter(e=>flags(e)[fFlag]);
  if(/^s:/.test(fFlag)) list=list.filter(e=>streamOf(e)===fFlag.slice(2));
  if(q){const k=q.toLowerCase();list=list.filter(e=>[e.where,e.paidTo,e.purpose,e.category,e.head,e.note,e.source,e.mode,String(e.amount)].join(" ").toLowerCase().includes(k))}
  list.sort((a,b)=>b.date.localeCompare(a.date)||b.amount-a.amount);
  const base=data.expenses.filter(e=>inProject(e)&&periodOk(e)&&active(e));
  const chips=[["","All",base.length]].concat(CATS.map(c=>[c,CAT_SHORT[c]||c,base.filter(e=>e.category===c).length]).filter(c=>c[2]));
  const groups=groupBy(list,e=>monthKey(e.date));
  V.innerHTML=`<div class="tools">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search place, vendor, purpose, amount" value="${esc(q)}" autocomplete="off"></label>

      ${Object.keys(STREAM).map(k=>`<button class="chip" data-f="s:${k}" aria-pressed="${fFlag==="s:"+k}">${STREAM_SHORT[k]}</button>`).join("")}${Object.keys(FLAGS).map(k=>`<button class="chip o" data-f="${k}" aria-pressed="${fFlag===k}">${FLAGS[k]}</button>`).join("")}</div>
  </div>
  ${(data.schoolsList||[]).length?`<div class="chips" style="margin:-4px 0 10px"><select class="chip" id="fSch"><option value="">Any school</option><option value="Pilot-wide" ${fSchool==="Pilot-wide"?"selected":""}>Pilot-wide</option>${data.schoolsList.map(x=>`<option value="School ${x.no}" ${fSchool==="School "+x.no?"selected":""}>School ${x.no}</option>`).join("")}</select><select class="chip" id="fActSel"><option value="">Any activity</option>${PHASES.map(p=>`<optgroup label="${p}"><option value="${p}" ${fAct===p?"selected":""}>All of ${p}</option>${(data.activities||[]).filter(a=>a[0]===p).map(a=>`<option ${fAct===a[1]?"selected":""}>${esc(a[1])}</option>`).join("")}</optgroup>`).join("")}</select></div>`:""}
  ${fHead?`<div class="sumbar"><span>Head: <b style="font-family:var(--sans);font-size:14px">${esc(fHead)}</b></span><button style="background:var(--fill);color:var(--ink)" id="clrHead">Clear</button></div>`:""}
  <div class="sumbar"><span>${list.length} expense${list.length===1?"":"s"}${gstOf(list)?` · <span style="color:var(--ink2)">GST ${inr(gstOf(list))}</span>`:""}</span><b class="num">${inr(paid(list))}</b>${fFlag==="owed"&&list.length?'<button id="settleAll">Mark all settled</button>':""}</div>
  ${list.length?Object.keys(groups).sort().reverse().map(m=>`<div class="month"><h3>${monthName(m)}<small>${inr(paid(groups[m]))}</small></h3><div class="list">${groups[m].map(rowHtml).join("")}</div></div>`).join(""):'<div class="card" style="margin-top:14px"><div class="empty"><b>Nothing here</b>Try another filter or period.</div></div>'}`;
  const qi=$("#q"); qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;renderExpenses();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
  V.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{fCat=b.dataset.c;renderExpenses()});
  V.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{fFlag=fFlag===b.dataset.f?"":b.dataset.f;renderExpenses()});
  const ch=$("#clrHead"); if(ch) ch.onclick=()=>{fHead="";renderExpenses()};
  const fs=$("#fSch"); if(fs) fs.onchange=()=>{fSchool=fs.value;renderExpenses()};
  const fa=$("#fActSel"); if(fa) fa.onchange=()=>{fAct=fa.value;renderExpenses()};
  const sa=$("#settleAll"); if(sa) sa.onclick=()=>{list.forEach(e=>enqueue({op:"save",item:Object.assign({},e,{reimb:"settled"})}));toast(list.length+" marked settled")};
  bindRows(V);
}

function saveCsv(rows,name){
  const c=v=>{v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};

  const blob=new Blob([csv],{type:"text/csv"});
  const file=typeof File==="function"?new File([blob],name,{type:"text/csv"}):null;
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){navigator.share({files:[file],title:name}).catch(()=>{});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast("CSV downloaded · "+(rows.length-1)+" rows");

function money(v){if(typeof v==="number")return Math.round(v*100)/100;const m=String(v||"").replace(/,/g,"").match(/-?\d+(\.\d+)?/);return m?Math.round(+m[0]*100)/100:0}

  if(typeof v==="number"&&v>30000&&v<60000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())}
  const s=String(v||"").trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);
  const yr=(s.match(/\b(20\d\d)\b/)||String(hint||"").match(/\b(20\d\d)\b/)||[0,new Date().getFullYear()])[1];
  if((m=s.match(/([a-z]{3})[a-z]*\.?\s+(\d{1,2})/i))&&MON[m[1].toLowerCase()]) return yr+"-"+pad(MON[m[1].toLowerCase()])+"-"+pad(m[2]);
  if((m=s.match(/(\d{1,2})(?:st|nd|rd|th)?\s+([a-z]{3})/i))&&MON[m[2].toLowerCase()]) return yr+"-"+pad(MON[m[2].toLowerCase()])+"-"+pad(m[1]);
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){const y=m[3].length===2?"20"+m[3]:m[3];return dmy?y+"-"+pad(m[2])+"-"+pad(m[1]):y+"-"+pad(m[1])+"-"+pad(m[2])}
  return "";
}
function matchCat(v){const s=String(v||"").toLowerCase();if(!s)return"";const ex=CATS.find(c=>c.toLowerCase()===s);if(ex)return ex;
  if(/travel|cab|auto|taxi|uber|ola|fuel|train|conveyance/.test(s))return"Travel";if(/food|meal|lunch|tea|snack|refresh/.test(s))return"Food";
  if(/print|station|xerox|cop/.test(s))return"Printing & Stationery";if(/software|subscri|tool|saas|licen/.test(s))return"Software & Tools";
  if(/venue|event|hall/.test(s))return"Venue & Events";if(/staff|honorar|salar|stipend|retainer/.test(s))return"Salaries & Retainers";
  if(/legal|complian|patent|incorporat|gst|roc|stamp/.test(s))return"Legal & Compliance";if(/laptop|hardware|device|scanner|tablet/.test(s))return"Hardware";return""}
function guessCat(d){const s=String(d||"").toLowerCase();
  if(/openai|chatgpt|genspark|claude|anthropic|canva|google workspace|zoom|notion|subscription|monthly payment|aws|domain|hosting/.test(s))return"Software & Tools";
  if(/print|cop(y|ies)|dossier|stationer|letter|filing|xerox|file[s]?\b|lamina/.test(s))return"Printing & Stationery";
  if(/travel|cab|auto|taxi|uber|ola|train|metro|bus|fuel|toll|parking/.test(s))return"Travel";
  if(/food|lunch|dinner|tea|snack|meal|refresh/.test(s))return"Food";
  if(/venue|hall|event|banner/.test(s))return"Venue & Events";
  if(/patent|legal|ca fee|incorporat|stamp duty|roc|gst/.test(s))return"Legal & Compliance";
  if(/laptop|hardware|scanner|tablet/.test(s))return"Hardware";
  return matchCat(s)||"Other"}
function guessVendor(d){const m=String(d||"").match(/\b(OpenAI(?: LLC)?|GenSpark(?:\.ai)?|Anthropic|Canva|Uber|Ola|Rapido|Amazon|Zoom|AWS)\b/i);return m?m[1]:""}
function person(v){const s=String(v||"").toLowerCase();return /praj/.test(s)&&/dev/.test(s)?"":/praj/.test(s)?"praj":/dev/.test(s)?"dev":""}
const FIELDS=[["date","Date",["date","day","meeting date","when"]],["amount","Amount",["amount","cost","total","inr","rs","₹","spent","value","expense"]],["cat","Category",["category","type","head","expense type"]],["where","Where / details",["details","where","description","particulars","place","remarks","item","narration"]],["vendor","Paid to",["paid to","vendor","payee","merchant","shop"]],["by","Paid by",["paid by","by who","owner","spent by","who"]],["mode","Mode",["mode","payment","paid via"]],["gst","GST",["gst","igst","tax amount","tax"]],["purpose","Purpose",["purpose","agenda","for","meeting"]]];
const findCol=(h,names)=>{for(const n of names){const i=h.findIndex(c=>c===n);if(i>=0)return i}for(const n of names){const i=h.findIndex(c=>c&&c.indexOf(n)===0);if(i>=0)return i}return -1};
let imp=null;
function openImport(){
  imp={step:"pick",dmy:true,project:project==="all"||project==="pilots"?DEFAULT_PROJECT:project};
  drawImport();
}
function drawImport(){
  const s=openSheet(`<header><button id="iC">${imp.step==="pick"?"Cancel":"Close"}</button><h3>Import expenses</h3><button class="strong" id="iAgain" ${imp.step==="pick"?"hidden":""}>Other file</button></header><div class="body" id="iBody"></div>`,"wide");
  $("#iC").onclick=closeSheet; const ag=$("#iAgain"); if(ag) ag.onclick=openImport;
  const B=$("#iBody");
  if(imp.step==="pick"){
    B.innerHTML=`<label class="drop" id="drop">${IC.xl.replace(/#fff/g,"currentColor")}<b>Choose an Excel or CSV file</b><small>.xlsx · .xls · .csv — e.g. a Lipik expense sheet with where each amount was spent</small><input type="file" id="iFile" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden></label>
    <p class="note">Two layouts work: <b>one expense per row</b> (Date, Amount, Category, Details…) or the <b>Lipik meeting log</b> (Travel / Misc / Food columns, each followed by Details). Nothing is saved until you tap Import.</p>`;
    $("#iFile").onchange=ev=>readFile(ev.target.files[0]);
    const d=$("#drop"); d.ondragover=e=>{e.preventDefault()}; d.ondrop=e=>{e.preventDefault();readFile(e.dataTransfer.files[0])};

  }

  buildPreview();

  const sheetChips=imp.wb.SheetNames.length>1?`<div class="chips" style="margin:12px 0 0">${imp.wb.SheetNames.map(n=>`<button class="chip" data-sh="${esc(n)}" aria-pressed="${imp.sheet===n}">${esc(n)}</button>`).join("")}</div>`:"";
  const mapping=imp.layout==="rows"?`<div class="flabel">Columns</div><div class="fgroup">${FIELDS.map(([k,l],i)=>`${i?'<div class="sep"></div>':""}<div class="maprow"><label>${l}${k==="date"||k==="amount"?' <span style="color:var(--orange)">*</span>':""}</label><select data-map="${k}"><option value="-1">—</option>${cols.map((c,j)=>`<option value="${j}" ${imp.map[k]===j?"selected":""}>${esc(c||"Column "+(j+1))}</option>`).join("")}</select></div>`).join("")}</div>`
   :`<div class="flabel">Layout</div><div class="fgroup"><div class="maprow"><label>Lipik meeting log</label><span style="color:var(--ink2);font-weight:700">${imp.groups.map(g=>esc(g.label)).join(" · ")}</span></div></div>`;
  B.innerHTML=`<div class="fgroup" style="margin-top:6px"><div class="maprow"><label>File</label><span style="color:var(--ink2);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(imp.fileName)}</span></div></div>
    ${sheetChips}${mapping}
    <div class="flabel">Options</div><div class="fgroup">
      <div class="maprow"><label>Project</label><input id="iProj" value="${esc(imp.project)}" list="projList2" style="border:0;background:var(--fill);border-radius:8px;padding:6px 10px;font-weight:600;text-align:right;max-width:60%;outline:0"><datalist id="projList2">${projects().map(p=>`<option value="${esc(p)}">`).join("")}</datalist></div><div class="sep"></div>
      <div class="maprow"><label>Dates like 06/09/2026 mean</label><div class="pick"><button data-dmy="1" aria-pressed="${imp.dmy}">6 Sep</button><button data-dmy="0" aria-pressed="${!imp.dmy}">9 Jun</button></div></div>
    </div>
    <div class="flabel">Preview · ${P.length} found</div>
    ${P.length?`<div class="list">${P.map((p,i)=>`<label class="prow${p.dup?" dup":""}"><input type="checkbox" data-i="${i}" ${p.on?"checked":""} ${p.have?"disabled":""}><div style="min-width:0"><div class="t">${esc(p.it.where||p.it.paidTo||p.it.category)}</div><div class="m">${dShort(p.it.date)} · ${esc(CAT_SHORT[p.it.category]||p.it.category)}${p.it.paidBy?" · "+PAID[p.it.paidBy]:""}${p.have?' · <span class="tag src">Already imported</span>':p.dup?' · <span class="tag warn">Possible duplicate</span>':""}</div></div><div class="a">${inr(p.it.amount)}</div></label>`).join("")}</div>`
      :`<div class="card"><div class="empty"><b>No expenses found</b>${imp.layout==="rows"?"Pick the Date and Amount columns above.":"No amounts in the Travel / Misc / Food columns."}</div></div>`}
    <div class="ibar"><span>${sel.length} selected · <b class="num">${inr(paid(sel.map(p=>p.it)))}</b></span><button class="btn o" id="iGo" ${sel.length?"":"disabled"}>Import ${sel.length||""}</button></div>`;
  B.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>{pickSheet(b.dataset.sh);drawImport()});
  B.querySelectorAll("[data-map]").forEach(sl=>sl.onchange=()=>{imp.map[sl.dataset.map]=+sl.value;imp.keep=null;drawImport()});
  B.querySelectorAll("[data-dmy]").forEach(b=>b.onclick=()=>{imp.dmy=b.dataset.dmy==="1";imp.keep=null;drawImport()});
  $("#iProj").onchange=e=>{imp.project=e.target.value.trim()||DEFAULT_PROJECT;drawImport()};
  B.querySelectorAll("[data-i]").forEach(c=>c.onchange=()=>{imp.keep=imp.keep||{};P[+c.dataset.i].on=c.checked;imp.keep[P[+c.dataset.i].it.srcKey]=c.checked;drawImport()});
  $("#iGo").onclick=doImport;
}
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=()=>no(new Error("Couldn't load the Excel reader — check your connection"));document.head.appendChild(s)})}
async function readFile(file){
  if(!file) return;
  imp.step="loading"; drawImport();
  try{
    await loadXLSX();
    const buf=await file.arrayBuffer();
    imp.wb=XLSX.read(buf,{type:"array",cellDates:true});
    imp.fileName=file.name;
    const best=imp.wb.SheetNames.find(n=>{const r=XLSX.utils.sheet_to_json(imp.wb.Sheets[n],{header:1,defval:""}).slice(0,10);return r.some(row=>row.some(c=>/^(travel|amount|cost|expense)/i.test(String(c).trim())))})||imp.wb.SheetNames[0];
    pickSheet(best); imp.step="map"; drawImport();
  }catch(e){imp.step="pick";drawImport();toast(e.message||"Couldn't read that file")}
}
function pickSheet(name){
  imp.sheet=name; imp.keep=null;
  const rows=XLSX.utils.sheet_to_json(imp.wb.Sheets[name],{header:1,raw:true,defval:""});
  const known=FIELDS.flatMap(f=>f[2]).concat(["travel","misc","food"]);
  let hr=0,best=0;
  rows.slice(0,12).forEach((r,i)=>{const n=r.filter(c=>{const s=String(c).trim().toLowerCase();return s&&known.some(k=>s===k||s.indexOf(k)===0)}).length;if(n>best){best=n;hr=i}});
  imp.rows=rows; imp.hr=hr;
  const h=(rows[hr]||[]).map(c=>String(c).trim()), hl=h.map(c=>c.toLowerCase());
  imp.header=h;
  const gi=[["travel","Travel","Travel"],["misc","Misc",null],["food","Food","Food"]].map(g=>({i:hl.indexOf(g[0]),label:g[1],cat:g[2],key:g[0]})).filter(g=>g.i>=0);
  if(gi.length>=2||(gi.length===1&&findCol(hl,["amount","cost","total"])<0)){imp.layout="wide";imp.groups=gi;imp.map={date:findCol(hl,["meeting date","date"]),by:findCol(hl,["owner","by who","paid by"]),purpose:findCol(hl,["agenda"]),who:findCol(hl,["attending","meeting name"])}}
  else{imp.layout="rows";imp.map={};FIELDS.forEach(([k,,names])=>imp.map[k]=findCol(hl,names));if(imp.map.cat>=0&&imp.map.cat===imp.map.where)imp.map.cat=-1}
}
function buildPreview(){
  const out=[],seen={},rows=imp.rows,m=imp.map,have=new Set(data.expenses.map(e=>e.srcKey).filter(Boolean));
  const tag=(imp.fileName+"|"+imp.sheet).toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,20);
  const src="Import · "+imp.fileName.replace(/\.(xlsx|xls|csv)$/i,"")+(imp.wb.SheetNames.length>1?" › "+imp.sheet:"");
  const push=(it,k0)=>{seen[k0]=(seen[k0]||0)+1;it.srcKey=k0+(seen[k0]>1?":"+seen[k0]:"");it.source=src;it.project=imp.project;it.head=headFor(it.category,it.where+" "+it.paidTo);it.stream=streamFor(it.category,it.where+" "+it.paidTo);it.reimb=it.reimb||"";it.gst=it.gst||0;out.push(it)};
  const cell=(r,i)=>i>=0?r[i]:"";
  for(let r=imp.hr+1;r<rows.length;r++){
    const row=rows[r];
    if(imp.layout==="wide"){
      imp.groups.forEach(g=>{const amt=money(row[g.i]);if(!(amt>0))return;const det=String(row[g.i+1]||"").trim(),date=toIso(cell(row,m.date),det,imp.dmy);if(!date)return;const cat=g.cat||guessCat(det);
        push({date,amount:amt,category:cat,where:det.replace(/^\s*\d{1,2}\/\d{1,2}\/\d{2,4}\s*[-–:]\s*/,""),paidTo:guessVendor(det),purpose:[cell(row,m.purpose),cell(row,m.who)].map(x=>String(x||"").replace(/\s+/g," ").trim()).filter(Boolean).join(" · "),paidBy:person(cell(row,m.by)),mode:"",note:"Row "+(r+1)},"xl:"+tag+":"+g.key+":"+date+":"+amt)});
    } else {
      if(m.amount<0||m.date<0) break;
      const amt=money(row[m.amount]);if(!(amt>0))continue;
      const det=String(cell(row,m.where)||"").trim(),date=toIso(row[m.date],det,imp.dmy);if(!date)continue;
      const cat=matchCat(cell(row,m.cat))||guessCat(det+" "+cell(row,m.cat));
      const md=String(cell(row,m.mode)||"").trim(), mode=MODES.find(x=>x.toLowerCase()===md.toLowerCase())||(/upi|gpay|phonepe|paytm/i.test(md)?"UPI":/card/i.test(md)?"Card":/cash/i.test(md)?"Cash":/bank|neft|imps|rtgs/i.test(md)?"Bank transfer":"");
      const gv=money(cell(row,m.gst));
      push({date,amount:amt,gst:gv>0&&gv<amt?gv:0,category:cat,where:det,paidTo:String(cell(row,m.vendor)||"").trim()||guessVendor(det),purpose:String(cell(row,m.purpose)||"").trim(),paidBy:person(cell(row,m.by)),mode,note:"Row "+(r+1)},"xl:"+tag+":"+date+":"+amt+":"+det.toLowerCase().replace(/\W+/g,"").slice(0,24));
    }
  }
  const act=data.expenses.filter(active);
  imp.preview=out.map(it=>{const hv=have.has(it.srcKey),dup=!hv&&act.some(e=>e.date===it.date&&Math.abs(e.amount-it.amount)<.01);
    const on=hv?false:(imp.keep&&it.srcKey in imp.keep?imp.keep[it.srcKey]:!dup);return {it,have:hv,dup,on}});
}
async function doImport(){
  const sel=imp.preview.filter(p=>p.on).map(p=>p.it), btn=$("#iGo");
  btn.disabled=true; btn.textContent="Importing…";
  let added=0,skipped=0;
  try{
    for(let i=0;i<sel.length;i+=150){const r=await api("import",{rows:sel.slice(i,i+150),source:sel[0].source});if(!r.ok)throw new Error(r.error);added+=r.added;skipped+=r.skipped}
    closeSheet(); await load(true); toast(added+" expense"+(added===1?"":"s")+" imported"+(skipped?" · "+skipped+" skipped":""));
  }catch(e){btn.disabled=false;btn.textContent="Import";toast("Import failed — "+(e.message||"offline"))}
}

/* ---------- setup / sign-in ---------- */
let pickSeq=0;
function showSetup(){
  const S=$("#setup"); S.hidden=false;
  $("#urlBox").hidden=!!(cfg.url);
  $("#apiUrl").value=cfg.url||"";
  $("#setupErr").textContent="";
  document.querySelectorAll("#whoSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.who===cfg.who));
  $("#signinBox").hidden=true; $("#claimBox").hidden=true;
  if(cfg.who&&cfg.url) pick(cfg.who);
}
async function pick(w){
  cfg.who=w; ls("ld.cfg",{url:cfg.url,base:cfg.base,who:w});
  document.querySelectorAll("#whoSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.who===w));
  const u=$("#apiUrl").value.trim(); if(u) cfg.url=u;
  if(!cfg.url){$("#urlBox").hidden=false;$("#setupErr").textContent="Paste the Ledger link first.";return}
  const my=++pickSeq;
  $("#setupWait").hidden=false; $("#signinBox").hidden=true; $("#claimBox").hidden=true; $("#setupErr").textContent="";
  try{
    const r=await api("status");
    if(my!==pickSeq) return;
    $("#setupWait").hidden=true;
    if(!r.ok) throw new Error(r.error);
    if(!r.ready) $("#setupErr").textContent="Ledger isn't set up yet — Dev needs to run setup in the script.";
    (r.claimed?$("#signinBox"):$("#claimBox")).hidden=false;
    setTimeout(()=>(r.claimed?$("#pass"):$("#invite")).focus(),50);
  }catch(e){ if(my!==pickSeq) return; $("#setupWait").hidden=true; $("#urlBox").hidden=false; $("#setupErr").textContent="Can't reach Ledger. Check the link and your connection."; }
}
document.querySelectorAll("#whoSeg button").forEach(b=>b.onclick=()=>pick(b.dataset.who));
$("#apiUrl").addEventListener("change",()=>{cfg.url=$("#apiUrl").value.trim();ls("ld.cfg",{url:cfg.url,base:cfg.base,who:cfg.who});if(cfg.who)pick(cfg.who)});
$("#setupForm").onsubmit=async ev=>{
  ev.preventDefault(); const E=$("#setupErr"); E.textContent="";
  if(!cfg.who){E.textContent="Tap your name first.";return}
  try{
    if(!$("#claimBox").hidden){
      const a=$("#newPass").value,b=$("#newPass2").value;
      if(a.length<6){E.textContent="Use at least 6 characters.";return}
      if(a!==b){E.textContent="The two passcodes don't match.";return}
      const r=await api("claim",{invite:$("#invite").value,newPass:a}); if(!r.ok){E.textContent=r.error;return}
      cfg.pass=a;
    } else if(!$("#signinBox").hidden){
      const p=$("#pass").value; cfg.pass=p;
      const r=await api("list"); if(!r.ok){cfg.pass="";E.textContent=r.error;return}
    } else return;
    ls("ld.cfg",cfg); $("#setup").hidden=true; ["#pass","#newPass","#newPass2","#invite"].forEach(s=>$(s).value="");
    load();
  }catch(e){E.textContent="Can't reach Ledger right now."}
};

/* ---------- boot ---------- */
$("#fab").onclick=()=>openExpense(null);
$("#refresh").onclick=()=>load();
window.addEventListener("scroll",()=>$("#nav").classList.toggle("scrolled",window.scrollY>30),{passive:true});
window.addEventListener("online",()=>load(true));
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&cfg.pass)load(true)});
setInterval(()=>{if(cfg.pass&&!document.hidden&&$("#setup").hidden)load(true)},60000);
render();
if(!cfg.pass||!cfg.url) showSetup(); else load();
if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
